name: Deploy to Railway

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        required: true
        default: Railway / production

permissions:
  contents: read

concurrency:
  group: railway-${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/release' && 'Railway / production' || 'Railway / development') }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_PUBLIC_CONVEX_URL: https://convex-api.invalid
      EXPO_PUBLIC_CONVEX_SITE_URL: https://convex-site.invalid
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy:
    name: Deploy Railway services
    needs: validate
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:5.37.2
    timeout-minutes: 180
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || (github.ref == 'refs/heads/release' && 'Railway / production' || 'Railway / development') }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      RAILWAY_DATABASE_SERVICE_ID: ${{ vars.RAILWAY_DATABASE_SERVICE_ID }}
      RAILWAY_BACKEND_SERVICE_ID: ${{ vars.RAILWAY_BACKEND_SERVICE_ID }}
      RAILWAY_DASHBOARD_SERVICE_ID: ${{ vars.RAILWAY_DASHBOARD_SERVICE_ID }}
      RAILWAY_FRONTEND_SERVICE_ID: ${{ vars.RAILWAY_FRONTEND_SERVICE_ID }}
      CONVEX_API_HEALTH_URL: ${{ vars.CONVEX_API_HEALTH_URL }}
      CONVEX_SITE_HEALTH_URL: ${{ vars.CONVEX_SITE_HEALTH_URL }}
      DASHBOARD_HEALTH_URL: ${{ vars.DASHBOARD_HEALTH_URL }}
      FRONTEND_HEALTH_URL: ${{ vars.FRONTEND_HEALTH_URL }}
    steps:
      - name: Install deployment dependencies
        run: apk add --no-cache git nodejs

      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          auth_header="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git init "$GITHUB_WORKSPACE"
          cd "$GITHUB_WORKSPACE"
          git remote add origin "$REPOSITORY_URL"
          git -c http.extraheader="AUTHORIZATION: basic $auth_header" fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          unset auth_header

      - name: Verify deployment tools
        run: |
          railway --version
          node --version

      - name: Deploy in dependency order
        run: node scripts/deploy-railway.mjs
